name: Admin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://perceptive-schnauzer-138.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL: https://perceptive-schnauzer-138.convex.site
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
